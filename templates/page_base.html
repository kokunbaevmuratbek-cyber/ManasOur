{% extends "base.html" %}

{% block extra_css %}
<style>
    .info, .info *, .info *::before, .info *::after { box-sizing: border-box; }

    .info {
        padding: clamp(32px, 6vw, 64px) 20px;
        background: var(--footer-bg-light);
        color: var(--footer-text);
        line-height: 1.7;
    }

    .info__wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 720px;
        margin: 0 auto;
    }

    .info__card {
        width: 100%;
        padding: clamp(24px, 5vw, 44px);
        background: #fff;
        border: 1px solid var(--footer-border);
        border-radius: 24px;
        box-shadow: 0 16px 40px var(--footer-shadow);
    }

    /* ===== Кнопка «Назад» ===== */
    .info__back {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 18px;
        background: #fff;
        border: 1px solid var(--footer-border);
        border-radius: 999px;
        color: var(--footer-title);
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 4px 12px var(--footer-shadow);
        transition: background 0.2s var(--footer-ease), color 0.2s var(--footer-ease), border-color 0.2s var(--footer-ease);
    }

    .info__back i { transition: transform 0.25s var(--footer-ease); }

    .info__back:hover {
        background: var(--footer-bg-hover);
        border-color: var(--footer-blue);
        color: var(--footer-blue-dark);
    }

    .info__back:hover i { transform: translateX(-3px); }

    .info__back:focus-visible {
        outline: 3px solid var(--footer-blue);
        outline-offset: 2px;
    }

    /* На широком экране «Назад» стоит слева от карточки, на узком над ней */
    @media (min-width: 1000px) {
        .info__back {
            position: absolute;
            top: 0;
            right: calc(100% + 24px);
        }
    }

    .info__title {
        margin: 0 0 10px;
        font-size: clamp(1.7rem, 4vw, 2.3rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--footer-title);
    }

    .info__lead { margin: 0 0 22px; font-size: 1.1rem; }

    .info p { margin: 0 0 12px; }

    .info__h {
        margin: 26px 0 8px;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--footer-title);
    }

    .info ul { margin: 0 0 12px; padding-left: 1.2rem; }
    .info li { margin-bottom: 4px; }

    .info__btn {
        display: inline-block;
        margin-top: 18px;
        padding: 12px 28px;
        border: 0;
        border-radius: 999px;
        background: var(--footer-title);
        color: #fff;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.25s var(--footer-ease);
    }

    .info__btn:hover { background: var(--footer-green-dark); }

    .info__btn:focus-visible {
        outline: 3px solid var(--footer-blue);
        outline-offset: 2px;
    }

    .info__notice {
        margin: 0 0 20px;
        padding: 12px 16px;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: var(--footer-radius);
        color: var(--footer-green-dark);
        font-weight: 600;
    }

    /* ===== Форма ===== */
    .fm { display: flex; flex-direction: column; gap: 18px; margin-top: 8px; }
    .fm__field { display: flex; flex-direction: column; gap: 6px; }

    .fm__label {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--footer-title);
    }

    .fm__input {
        width: 100%;
        padding: 13px 16px;
        background: var(--footer-bg-light);
        border: 1px solid var(--footer-border);
        border-radius: var(--footer-radius);
        font: inherit;
        color: var(--footer-title);
        transition: border-color 0.2s var(--footer-ease), box-shadow 0.2s var(--footer-ease), background 0.2s var(--footer-ease);
    }

    textarea.fm__input { min-height: 140px; resize: vertical; }

    .fm__input:focus {
        outline: none;
        background: #fff;
        border-color: var(--footer-blue);
        box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.18);
    }

    .fm__input--error { border-color: #dc2626; }
    .fm__error { margin: 0; font-size: 0.85rem; color: #b91c1c; }

    @media (prefers-reduced-motion: reduce) {
        .info__btn, .fm__input, .info__back, .info__back i { transition: none; }
        .info__back:hover i { transform: none; }
    }
</style>
{% endblock %}

{% block content %}
<section class="info">
    <div class="info__wrap">

        <a class="info__back" href="/"
           onclick="if (window.history.length > 1) { window.history.back(); return false; }">
            <i class="bi bi-arrow-left"></i>
            Назад
        </a>

        <div class="info__card">
            <h1 class="info__title">{% block page_title %}{% endblock %}</h1>
            {% block page_body %}{% endblock %}
        </div>

    </div>
</section>
{% endblock %}
